<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Emerald Legacy Solo Leveling Colosseum</title>
<style>
  :root {
    --bg:         #0b1624;
    --bg-panel:   #141e2e;
    --bg-panel-2: #1a2842;
    --bg-hover:   #223455;
    --green:      #2fb872;
    --green-deep: #1ea866;
    --green-glow: rgba(47, 184, 114, 0.45);
    --amber:      #f7a531;
    --amber-dim:  #b87820;
    --cyan:       #5fe3ff;
    --text:       #e4edf7;
    --text-dim:   #a9b8cc;
    --text-muted: #7d8ca3;
    --border:     #263a58;
    --bevel-light:#2d456a;
    --bevel-dark: #07101c;
    --mono: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(47,184,114,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(95,227,255,0.06), transparent 60%),
      var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    position: relative;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, #17253c 0%, #0f1a2b 100%);
    border-top: 1px solid var(--bevel-light);
    border-bottom: 2px solid var(--amber);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    flex-wrap: wrap;
    box-shadow: 0 4px 18px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -2px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--green) 20%, var(--cyan) 50%, var(--green) 80%, transparent);
    opacity: 0.55;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.5px;
    text-shadow: 0 0 12px var(--green-glow), 0 1px 0 rgba(0,0,0,0.6);
  }
  header p {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
    font-family: var(--mono);
    letter-spacing: 0.4px;
  }

  .header-links { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    padding: 7px 16px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
    display: inline-block;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .btn-secondary {
    background: linear-gradient(180deg, #1f2f4a 0%, #16233a 100%);
    color: var(--text-dim);
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), inset 0 -1px 0 rgba(0,0,0,0.5);
  }
  .btn-secondary:hover {
    border-color: var(--green);
    color: var(--green);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -1px 0 rgba(0,0,0,0.5), 0 0 10px var(--green-glow);
  }
  .btn-secondary.active {
    border-color: var(--amber);
    color: var(--amber);
    box-shadow: inset 0 0 0 1px rgba(247,165,49,0.25), 0 0 10px rgba(247,165,49,0.35);
  }

  /* ── Emulator area ── */
  #play-section {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background:
      radial-gradient(900px 400px at 50% 40%, rgba(47,184,114,0.08), transparent 70%),
      linear-gradient(180deg, #0c1627 0%, #0a1220 100%);
    overflow: hidden;
  }

  #game {
    position: relative;
    width: 100%;
    max-width: 720px;
    flex: 1;
    min-height: 0;
    max-height: calc(720px * (2/3));
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--bevel-light);
    box-shadow:
      0 0 0 1px var(--bevel-dark),
      0 18px 40px rgba(0,0,0,0.55),
      0 0 24px rgba(47,184,114,0.08);
  }

  /* ── Splash ── */
  #splash {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 28px;
    background: #000;
    z-index: 10;
  }

  #btn-start {
    position: relative;
    z-index: 1;
    padding: 12px 38px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    color: #fff;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.35),
      inset 0 -2px 0 rgba(0,0,0,0.35),
      0 6px 18px rgba(0,0,0,0.5),
      0 0 22px var(--green-glow);
    transition: transform 0.1s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  #btn-start:hover {
    transform: translateY(-1px) scale(1.03);
    filter: brightness(1.08);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 -2px 0 rgba(0,0,0,0.35),
      0 8px 22px rgba(0,0,0,0.55),
      0 0 30px var(--green-glow);
  }
  #btn-start:focus-visible {
    outline: none;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.45),
      0 0 0 2px var(--cyan),
      0 0 24px rgba(95,227,255,0.5);
  }

  /* ── Pokédex drawer ── */
  #dex-drawer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 42px;
    overflow: hidden;
    transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    background: var(--bg);
    z-index: 30;
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--bevel-light);
    box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
  }

  #dex-drawer.open { height: 66%; }

  #pokedex-frame {
    flex: 1;
    width: 100%;
    border: none;
    display: block;
  }

  /* ── Toggle bar (inside drawer, at top) ── */
  #dex-toggle {
    flex-shrink: 0;
    position: relative;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, #1a2842 0%, #0f1a2b 100%);
    border-top: 1px solid var(--amber-dim);
    border-bottom: 1px solid var(--bevel-dark);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, filter 0.15s;
  }

  #dex-toggle::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    opacity: 0.7;
  }

  #dex-toggle:hover { filter: brightness(1.15); }

  #dex-toggle span:first-child {
    font-size: 12px;
    font-weight: 800;
    color: var(--amber);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: var(--mono);
    text-shadow: 0 0 10px rgba(247,165,49,0.35);
  }

  #dex-arrow {
    font-size: 11px;
    color: var(--green);
    transition: transform 0.35s;
    text-shadow: 0 0 8px var(--green-glow);
  }

  #dex-toggle.open #dex-arrow { transform: rotate(180deg); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Pokémon Emerald Legacy Solo Leveling Colosseum</h1>
    <p>A fan-made ROM hack for Pokémon Emerald</p>
  </div>
  <div class="header-links">
    <button class="btn btn-secondary" id="btn-dex-header" onclick="toggleDex()">Pokédex</button>
    <a class="btn btn-secondary" href="https://github.com/diogodebastos/Pokemon_Emerald_Legacy" target="_blank">GitHub</a>
  </div>
</header>

<!-- ── Emulator ── -->
<section id="play-section">
  <div id="game">
    <div id="splash">
      <img src="title.png" alt="Pokémon Emerald Legacy title screen"
           style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;">
      <button id="btn-start" onclick="startGame()">▶ Start Game</button>
    </div>
  </div>

  <div id="dex-drawer">
    <div id="dex-toggle" onclick="toggleDex()">
      <span>Pokédex</span>
      <span id="dex-arrow">▲</span>
    </div>
    <iframe id="pokedex-frame" src="pokedex.html" title="Pokédex" loading="lazy"></iframe>
  </div>
</section>

<script>
  const THEME_RED = getComputedStyle(document.documentElement).getPropertyValue('--red').trim();

  function startGame() {
    document.getElementById('splash').style.display = 'none';

    window.EJS_player        = '#game';
    window.EJS_core          = 'gba';
    window.EJS_gameUrl       = 'rom/legacy.gba';
    window.EJS_pathtodata    = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_color         = THEME_RED;
    window.EJS_startOnLoaded = true;

    const s = document.createElement('script');
    s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(s);
  }

  function toggleDex() {
    const drawer = document.getElementById('dex-drawer');
    const toggle = document.getElementById('dex-toggle');
    const isOpen = drawer.classList.toggle('open');
    toggle.classList.toggle('open', isOpen);
    document.getElementById('btn-dex-header').classList.toggle('active', isOpen);
  }

  document.getElementById('play-section').addEventListener('click', function(e) {
    const drawer = document.getElementById('dex-drawer');
    if (drawer.classList.contains('open') && !drawer.contains(e.target)) {
      toggleDex();
    }
  });
</script>

</body>
</html>

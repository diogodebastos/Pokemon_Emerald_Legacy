<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Emerald Legacy — Solo Leveling Colosseum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-0:      #060d16;
    --ink-1:      #0a121d;
    --ink-2:      #101a28;
    --ink-3:      #172436;
    --line:       #1f2f46;
    --line-soft:  #17223433;
    --text:       #eaf2fb;
    --text-dim:   #93a3b8;
    --text-muted: #5e6d82;
    --em:         #3dd787;
    --em-deep:    #1aa864;
    --em-soft:    rgba(61,215,135,0.14);
    --amber:      #f5b642;
    --ring:       rgba(61,215,135,0.35);

    --font-sans: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font-sans);
    font-feature-settings: "ss01", "cv11";
    background: var(--ink-0);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Header ── */
  header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 18px 28px;
    flex-shrink: 0;
    flex-wrap: wrap;
    background: var(--ink-1);
    border-bottom: 1px solid var(--line);
    z-index: 2;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #fff 0%, #fff 6%, transparent 7%),
      conic-gradient(from 210deg, #ef5d60 0 50%, #eaf2fb 50% 100%);
    border: 3px solid var(--ink-0);
    box-shadow: 0 0 0 1px var(--line), 0 0 18px rgba(239,93,96,0.25);
    position: relative;
    flex-shrink: 0;
  }
  .brand-mark::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 10px; height: 10px;
    background: var(--ink-0);
    border: 2px solid var(--ink-0);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: inset 0 0 0 2px #fff;
  }

  .brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

  .brand h1 {
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand h1 em {
    color: var(--em);
    font-style: normal;
    font-weight: 600;
  }
  .brand p {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .header-links { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .btn {
    padding: 9px 16px;
    border-radius: var(--r-sm);
    border: 1px solid var(--line);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--ink-2);
    color: var(--text-dim);
  }
  .btn:hover { color: var(--text); border-color: var(--line); background: var(--ink-3); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ink-0), 0 0 0 4px var(--ring); }

  .btn-ghost.active {
    color: var(--em);
    border-color: var(--em);
    background: var(--em-soft);
  }

  .btn .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.15s;
  }
  .btn-ghost.active .dot { background: var(--em); box-shadow: 0 0 8px var(--em); }

  /* ── Emulator area ── */
  #play-section {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    background:
      radial-gradient(1000px 500px at 50% 0%, rgba(61,215,135,0.06), transparent 55%),
      linear-gradient(180deg, var(--ink-1) 0%, var(--ink-0) 100%);
    overflow: hidden;
  }

  /* subtle grid pattern for retro-computing vibe */
  #play-section::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.85) 0%, transparent 75%);
    pointer-events: none;
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
    min-height: 0;
  }

  .stage-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .stage-meta .left, .stage-meta .right { display: flex; align-items: center; gap: 10px; }
  .stage-meta .sep { width: 1px; height: 10px; background: var(--line); }
  .stage-meta .status { display: inline-flex; align-items: center; gap: 6px; color: var(--em); }
  .stage-meta .status::before {
    content: "";
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--em);
    box-shadow: 0 0 8px var(--em);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  #game {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 0;
    max-height: calc(720px * (2/3));
    background: #000;
    border-radius: var(--r-md);
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.03) inset,
      0 30px 60px -20px rgba(0,0,0,0.8),
      0 0 0 1px var(--ink-0);
  }

  /* ── Splash ── */
  #splash {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 36px;
    background: #000;
    z-index: 10;
  }
  #splash::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }

  .splash-cta {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .splash-hint {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(234,242,251,0.55);
  }

  #btn-start {
    position: relative;
    padding: 13px 36px 13px 30px;
    border-radius: var(--r-md);
    border: 1px solid rgba(61,215,135,0.5);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink-0);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #4ee093 0%, var(--em-deep) 100%);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.35),
      0 10px 30px -8px rgba(61,215,135,0.45);
  }
  #btn-start::before {
    content: "";
    width: 0;
    height: 0;
    border-left: 8px solid var(--ink-0);
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }
  #btn-start:hover { transform: translateY(-1px); filter: brightness(1.06); }
  #btn-start:focus-visible {
    outline: none;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.4),
      0 0 0 2px var(--ink-0),
      0 0 0 4px var(--em);
  }

  /* ── Pokédex drawer ── */
  #dex-drawer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 44px;
    overflow: hidden;
    transition: height 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    background: var(--ink-1);
    z-index: 30;
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--line);
  }
  #dex-drawer.open { height: 68%; }

  #pokedex-frame {
    flex: 1;
    width: 100%;
    border: none;
    display: block;
    background: var(--ink-1);
  }

  #dex-toggle {
    flex-shrink: 0;
    position: relative;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    user-select: none;
    background: var(--ink-1);
    transition: background 0.15s;
  }
  #dex-toggle:hover { background: var(--ink-2); }

  #dex-toggle::before {
    content: "";
    position: absolute;
    left: 24px; right: 24px; top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--em) 20%, var(--em) 80%, transparent);
    opacity: 0.35;
    transition: opacity 0.25s;
  }
  #dex-toggle.open::before { opacity: 0.9; }

  #dex-toggle .label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  #dex-toggle .chip {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--em);
    background: var(--em-soft);
    border: 1px solid rgba(61,215,135,0.3);
    padding: 3px 8px;
    border-radius: 999px;
  }
  #dex-toggle span.title {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  #dex-toggle .hint {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  #dex-arrow {
    font-size: 10px;
    color: var(--em);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    margin-left: 6px;
  }
  #dex-toggle.open #dex-arrow { transform: rotate(180deg); }

  @media (max-width: 640px) {
    header { padding: 14px 18px; }
    .brand h1 { font-size: 14px; white-space: normal; }
    #play-section { padding: 16px 12px; }
    .stage-meta { display: none; }
    #dex-toggle .hint { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"></div>
    <div class="brand-text">
      <h1><em>Emerald Legacy</em> · Solo Leveling Colosseum</h1>
      <p>ROM hack · Pokémon Emerald</p>
    </div>
  </div>
  <div class="header-links">
    <button class="btn btn-ghost" id="btn-dex-header" onclick="toggleDex()">
      <span class="dot"></span>Pokédex
    </button>
    <a class="btn" href="https://github.com/diogodebastos/Pokemon_Emerald_Legacy" target="_blank">GitHub ↗</a>
  </div>
</header>

<!-- ── Emulator ── -->
<section id="play-section">
  <div class="stage">
    <div class="stage-meta">
      <div class="left">
        <span>GBA</span><span class="sep"></span><span>legacy.gba</span>
      </div>
      <div class="right">
        <span class="status">Ready</span>
      </div>
    </div>
    <div id="game">
      <div id="splash">
        <img src="title.png" alt="Pokémon Emerald Legacy title screen"
             style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;">
        <div class="splash-cta">
          <span class="splash-hint">Press to play</span>
          <button id="btn-start" onclick="startGame()">Start Game</button>
        </div>
      </div>
    </div>
  </div>

  <div id="dex-drawer">
    <div id="dex-toggle" onclick="toggleDex()">
      <span class="label">
        <span class="chip">Dex</span>
        <span class="title">National Pokédex</span>
      </span>
      <span class="hint">386 entries</span>
      <span id="dex-arrow">▲</span>
    </div>
    <iframe id="pokedex-frame" src="pokedex.html" title="Pokédex" loading="lazy"></iframe>
  </div>
</section>

<script>
  const THEME_COLOR = getComputedStyle(document.documentElement).getPropertyValue('--em').trim();

  function startGame() {
    document.getElementById('splash').style.display = 'none';

    window.EJS_player        = '#game';
    window.EJS_core          = 'gba';
    window.EJS_gameUrl       = 'rom/legacy.gba';
    window.EJS_pathtodata    = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_color         = THEME_COLOR;
    window.EJS_startOnLoaded = true;

    const s = document.createElement('script');
    s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(s);
  }

  function toggleDex() {
    const drawer = document.getElementById('dex-drawer');
    const toggle = document.getElementById('dex-toggle');
    const isOpen = drawer.classList.toggle('open');
    toggle.classList.toggle('open', isOpen);
    document.getElementById('btn-dex-header').classList.toggle('active', isOpen);
  }

  document.getElementById('play-section').addEventListener('click', function(e) {
    const drawer = document.getElementById('dex-drawer');
    if (drawer.classList.contains('open') && !drawer.contains(e.target)) {
      toggleDex();
    }
  });
</script>

</body>
</html>

ity weather in Gen 3 lasts until another weather replaces it, so no one spends a turn on Sunny Day. Sun doubles Chlorophyll users’ Speed, lets <b>Solar Beam</b> fire in one turn, boosts Fire moves by 50% and halves Water moves, Groudon’s weakness. Only Exeggutor is grounded, so Groudon can Earthquake freely next to anyone else."},{"type":"leads","leads":[[{"sprite":"mon:GROUDON","sp":"GROUDON","name":"Groudon"},{"sprite":"mon:HO_OH","sp":"HO_OH","name":"Ho-Oh"}],[{"sprite":"mon:TROPIUS","sp":"TROPIUS","name":"Tropius"},{"sprite":"mon:JUMPLUFF","sp":"JUMPLUFF","name":"Jumpluff"}]]},{"type":"team","members":[{"sprite":"mon:GROUDON","sp":"GROUDON","name":"Groudon","types":["GROUND"],"ability":"Drought","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Naive","moves":[{"type":"GROUND","name":"Earthquake","power":100,"target":"all · hits ally","how":"Lv 35 · TM26","tip":"","alt":""},{"type":"FIRE","name":"Fire Blast","power":120,"target":"","how":"Lv 55 · TM38","tip":"","alt":""},{"type":"GRASS","name":"Solar Beam","power":120,"target":"","how":"Lv 50 · TM22","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":"Post-game (Terra Cave). Earthquake uses its 150 Attack; sun-boosted Fire Blast and one-turn Solar Beam are special, so Naive keeps both sides."},{"sprite":"mon:HO_OH","sp":"HO_OH","name":"Ho-Oh","types":["FIRE","FLYING"],"ability":"Pressure","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Modest","moves":[{"type":"FIRE","name":"Sacred Fire","power":100,"target":"","how":"Lv 77","tip":"","alt":""},{"type":"ELECTRIC","name":"Thunderbolt","power":95,"target":"","how":"TM24","tip":"","alt":""},{"type":"NORMAL","name":"Recover","power":"—","target":"","how":"Lv 33","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":"Post-game (Navel Rock). Sacred Fire is special here and hits very hard in sun. Flying, so Groudon’s Earthquake never hits it."},{"sprite":"mon:LATIOS","sp":"LATIOS","name":"Latios","types":["DRAGON","PSYCHIC"],"ability":"Levitate","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Timid","moves":[{"type":"DRAGON","name":"Dragon Claw","power":90,"target":"","how":"TM02","tip":"","alt":""},{"type":"PSYCHIC","name":"Psychic","power":90,"target":"","how":"Lv 40 · TM29","tip":"","alt":""},{"type":"ELECTRIC","name":"Thunderbolt","power":95,"target":"","how":"TM24","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"Lv 25 · TM17","tip":"","alt":""}],"note":"Post-game. Dragon resists Water, Grass, Fire and Electric, and Levitate keeps it safe from Earthquake."},{"sprite":"mon:TROPIUS","sp":"TROPIUS","name":"Tropius","types":["GRASS","FLYING"],"ability":"Chlorophyll","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Modest","moves":[{"type":"GRASS","name":"Solar Beam","power":120,"target":"","how":"Lv 41 · TM22","tip":"","alt":""},{"type":"GRASS","name":"Synthesis","power":"—","target":"","how":"Lv 45","tip":"","alt":""},{"type":"FIRE","name":"Sunny Day","power":"—","target":"","how":"Lv 27 · TM11","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":"A Flying Chlorophyll sweeper, so Earthquake can’t hit it. Synthesis heals ⅔ of its HP in sun, and Sunny Day brings the sun back if Groudon faints."},{"sprite":"mon:EXEGGUTOR","sp":"EXEGGUTOR","name":"Exeggutor","types":["GRASS","PSYCHIC"],"ability":"Chlorophyll","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Modest","moves":[{"type":"GRASS","name":"Sleep Powder","power":"—","target":"","how":"Lv 37","tip":"","alt":""},{"type":"GRASS","name":"Solar Beam","power":120,"target":"","how":"Lv 43 · TM22","tip":"","alt":""},{"type":"PSYCHIC","name":"Psychic","power":90,"target":"","how":"Lv 48 · TM29","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":"The strongest Solar Beam on the team. The only grounded member: Groudon must not Earthquake while it’s out."},{"sprite":"mon:JUMPLUFF","sp":"JUMPLUFF","name":"Jumpluff","types":["GRASS","FLYING"],"ability":"Chlorophyll","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Jolly","moves":[{"type":"GRASS","name":"Sleep Powder","power":"—","target":"","how":"Lv 17","tip":"","alt":""},{"type":"GRASS","name":"Leech Seed","power":"—","target":"","how":"Lv 22","tip":"","alt":""},{"type":"NORMAL","name":"Encore","power":"—","target":"","how":"Lv 1","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":"Grass/Flying support, immune to Earthquake. In sun it outspeeds everything, so Sleep Powder lands first."}]},{"type":"p","html":"<span class=\"dim\">Every move, ability and item here was checked against this hack’s data. Egg moves can be taught by the Move Relearner (Fallarbor Town or Artisan Cave, 1 Heart Scale), and a working breeding father is listed when one exists. A ⚑ marks an egg move that breeding can’t deliver: hover it for the fallback. Tutors in this hack teach any number of times, and the Battle Frontier tutors are free.</span>"}]},{"id":"team-eevee","section":"Double Battles","title":"Eeveelution Team","kicker":"This version’s starters","blocks":[{"type":"p","html":"Every Gen 3 Eeveelution, plus Eevee itself. Your starter is an Eevee, Espeon or Umbreon, and the rest can be caught (see the Pokédex). All of them learn <b>Helping Hand</b>, so any pair can boost the other. Espeon and Umbreon are covered in more depth on their own team page."},{"type":"leads","leads":[[{"sprite":"mon:ESPEON","sp":"ESPEON","name":"Espeon"},{"sprite":"mon:UMBREON","sp":"UMBREON","name":"Umbreon"}],[{"sprite":"mon:VAPOREON","sp":"VAPOREON","name":"Vaporeon"},{"sprite":"mon:JOLTEON","sp":"JOLTEON","name":"Jolteon"}]]},{"type":"team","members":[{"sprite":"mon:ESPEON","sp":"ESPEON","name":"Espeon","types":["PSYCHIC"],"ability":"Synchronize","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Timid","moves":[{"type":"PSYCHIC","name":"Psychic","power":90,"target":"","how":"Lv 42 · TM29","tip":"","alt":""},{"type":"GHOST","name":"Shadow Ball","power":80,"target":"","how":"TM30","tip":"","alt":""},{"type":"PSYCHIC","name":"Light Screen","power":"—","target":"","how":"TM16","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":"The special attacker. Ghost is special in this hack, so Shadow Ball uses its Sp. Atk and hits Psychic and Ghost types."},{"sprite":"mon:UMBREON","sp":"UMBREON","name":"Umbreon","types":["DARK"],"ability":"Synchronize","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Bold","moves":[{"type":"NORMAL","name":"Wish","power":"—","target":"","how":"Lv 50 as Eevee","tip":"","alt":""},{"type":"NORMAL","name":"Helping Hand","power":"—","target":"","how":"Lv 1","tip":"","alt":""},{"type":"GHOST","name":"Confuse Ray","power":"—","target":"","how":"Lv 25","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":"The wall. Immune to Psychic, and resists Ghost and Dark, which covers Espeon’s weaknesses."},{"sprite":"mon:VAPOREON","sp":"VAPOREON","name":"Vaporeon","types":["WATER"],"ability":"Water Absorb","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Bold","moves":[{"type":"WATER","name":"Surf","power":95,"target":"both foes · ½","how":"HM03","tip":"","alt":""},{"type":"ICE","name":"Ice Beam","power":95,"target":"","how":"TM13","tip":"","alt":""},{"type":"NORMAL","name":"Wish","power":"—","target":"","how":"Lv 50 as Eevee","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":"Base 130 HP. Water Absorb heals it when hit by Water. Surf never hits its partner."},{"sprite":"mon:JOLTEON","sp":"JOLTEON","name":"Jolteon","types":["ELECTRIC"],"ability":"Volt Absorb","item":{"icon":"item:ITEM_MAGNET","key":"ITEM_MAGNET","name":"Magnet"},"nature":"Timid","moves":[{"type":"ELECTRIC","name":"Thunderbolt","power":95,"target":"","how":"TM24","tip":"","alt":""},{"type":"ELECTRIC","name":"Thunder Wave","power":"—","target":"","how":"Lv 42 · Tutor (Battle Frontier)","tip":"","alt":""},{"type":"NORMAL","name":"Helping Hand","power":"—","target":"","how":"Lv 1","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":"Base 130 Speed. Thunder Wave slows the fast threats, and Volt Absorb heals it when hit by Electric."},{"sprite":"mon:FLAREON","sp":"FLAREON","name":"Flareon","types":["FIRE"],"ability":"Flash Fire","item":{"icon":"item:ITEM_CHARCOAL","key":"ITEM_CHARCOAL","name":"Charcoal"},"nature":"Modest","moves":[{"type":"FIRE","name":"Flamethrower","power":95,"target":"","how":"Lv 49 · TM35","tip":"","alt":""},{"type":"GHOST","name":"Shadow Ball","power":80,"target":"","how":"TM30","tip":"","alt":""},{"type":"NORMAL","name":"Helping Hand","power":"—","target":"","how":"Lv 1","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":"Fire is special and this hack makes Ghost special too, so Flamethrower and Shadow Ball both use its 110 Sp. Atk. Flash Fire makes it immune to Fire."},{"sprite":"mon:EEVEE","sp":"EEVEE","name":"Eevee","types":["NORMAL"],"ability":"Run Away","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Bold","moves":[{"type":"NORMAL","name":"Wish","power":"—","target":"","how":"Lv 50","tip":"","alt":""},{"type":"NORMAL","name":"Baton Pass","power":"—","target":"","how":"Lv 31","tip":"","alt":""},{"type":"NORMAL","name":"Helping Hand","power":"—","target":"","how":"Lv 1","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":"Weak stats, but pure support: Wish heals a partner, Helping Hand boosts one, and Baton Pass passes boosts. Learns Wish at level 50."}]},{"type":"p","html":"<span class=\"dim\">Every move, ability and item here was checked against this hack’s data. Egg moves can be taught by the Move Relearner (Fallarbor Town or Artisan Cave, 1 Heart Scale), and a working breeding father is listed when one exists. A ⚑ marks an egg move that breeding can’t deliver: hover it for the fallback. Tutors in this hack teach any number of times, and the Battle Frontier tutors are free.</span>"}]},{"id":"doubles-combos","section":"Double Battles","title":"Partner Combos","kicker":"Pairs that only work in doubles","blocks":[{"type":"p","html":"Two-Pokémon combos that only work in doubles. Each relies on a mechanic confirmed in this game’s battle code."},{"type":"h","text":"Wonder Guard shield"},{"type":"p","html":"Wonder Guard blocks every hit that isn’t super effective, <b>including your partner’s</b>. Ground is not very effective on Bug/Ghost, and Normal can’t touch Ghost, so Golem can use Earthquake and Explosion freely beside Shedinja. <b>Risk:</b> Shedinja has 1 HP. Sandstorm, hail, poison, burn and any Fire, Flying, Rock, Ghost or Dark attack faint it. That includes spread Rock Slide and Heat Wave."},{"type":"team","members":[{"sprite":"mon:SHEDINJA","sp":"SHEDINJA","name":"Shedinja","types":["BUG","GHOST"],"ability":"Wonder Guard","item":{"icon":"item:ITEM_BRIGHT_POWDER","key":"ITEM_BRIGHT_POWDER","name":"Brightpowder"},"nature":"Adamant","moves":[{"type":"DARK","name":"Faint Attack","power":70,"target":"","how":"Lv 38","tip":"","alt":""},{"type":"FLYING","name":"Aerial Ace","power":60,"target":"","how":"TM40","tip":"","alt":""},{"type":"POISON","name":"Toxic","power":"—","target":"","how":"TM06","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""},{"sprite":"mon:GOLEM","sp":"GOLEM","name":"Golem","types":["ROCK","GROUND"],"ability":"Sturdy","item":{"icon":"item:ITEM_SOFT_SAND","key":"ITEM_SOFT_SAND","name":"Soft Sand"},"nature":"Adamant","moves":[{"type":"GROUND","name":"Earthquake","power":100,"target":"all · hits ally","how":"Lv 42 · TM26","tip":"","alt":""},{"type":"NORMAL","name":"Explosion","power":250,"target":"all · hits ally","how":"Lv 46 · Tutor (Pacifidlog Town)","tip":"","alt":""},{"type":"ROCK","name":"Rock Slide","power":80,"target":"both foes · ½","how":"Tutor (Battle Frontier)","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Lightning Rod bodyguard"},{"type":"p","html":"Lightning Rod pulls the <b>opponents’</b> single-target Electric moves onto Marowak, which is a Ground type and takes no damage. That protects Gyarados’s 4× Electric weakness. Gyarados is Flying, so Thick Club Earthquake never hits it. Lightning Rod doesn’t redirect your own team’s moves."},{"type":"team","members":[{"sprite":"mon:MAROWAK","sp":"MAROWAK","name":"Marowak","types":["GROUND"],"ability":"Lightning Rod","item":{"icon":"item:ITEM_THICK_CLUB","key":"ITEM_THICK_CLUB","name":"Thick Club"},"nature":"Adamant","moves":[{"type":"GROUND","name":"Earthquake","power":100,"target":"all · hits ally","how":"TM26","tip":"","alt":""},{"type":"ROCK","name":"Rock Slide","power":80,"target":"both foes · ½","how":"Tutor (Battle Frontier)","tip":"","alt":""},{"type":"NORMAL","name":"Swords Dance","power":"—","target":"","how":"Tutor (Battle Frontier)","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""},{"sprite":"mon:GYARADOS","sp":"GYARADOS","name":"Gyarados","types":["WATER","FLYING"],"ability":"Intimidate","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Adamant","moves":[{"type":"DRAGON","name":"Dragon Dance","power":"—","target":"","how":"Lv 57","tip":"","alt":""},{"type":"NORMAL","name":"Double Edge","power":120,"target":"","how":"Tutor (Sootopolis City)","tip":"","alt":""},{"type":"FLYING","name":"Bounce","power":85,"target":"","how":"Lv 48","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Plus & Minus"},{"type":"p","html":"While both are on the field, each gets <b>×1.5 Sp. Atk</b>. Minun’s Follow Me or Encore protects Plusle while it attacks. Both are caught on Route 110, making this a strong early-game pair."},{"type":"team","members":[{"sprite":"mon:PLUSLE","sp":"PLUSLE","name":"Plusle","types":["ELECTRIC"],"ability":"Plus","item":{"icon":"item:ITEM_MAGNET","key":"ITEM_MAGNET","name":"Magnet"},"nature":"Timid","moves":[{"type":"ELECTRIC","name":"Thunderbolt","power":95,"target":"","how":"Lv 28 · TM24","tip":"","alt":""},{"type":"NORMAL","name":"Helping Hand","power":"—","target":"","how":"Lv 13","tip":"","alt":""},{"type":"NORMAL","name":"Encore","power":"—","target":"","how":"Lv 22","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""},{"sprite":"mon:MINUN","sp":"MINUN","name":"Minun","types":["ELECTRIC"],"ability":"Minus","item":{"icon":"item:ITEM_MAGNET","key":"ITEM_MAGNET","name":"Magnet"},"nature":"Timid","moves":[{"type":"ELECTRIC","name":"Thunderbolt","power":95,"target":"","how":"Lv 28 · TM24","tip":"","alt":""},{"type":"NORMAL","name":"Follow Me","power":"—","target":"","how":"Lv 16","tip":"","alt":""},{"type":"NORMAL","name":"Helping Hand","power":"—","target":"","how":"Lv 13","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Explosion + Ghost"},{"type":"p","html":"Explosion hits everyone else on the field and halves the targets’ Defense. Gengar is a Ghost type, so it’s immune to Metagross’s Explosion, and Levitate makes it immune to Earthquake too. Smogon lists this as the classic ADV doubles lead. Smogon’s current tournament rules ban Explosion, but this game allows it. Make sure the Explosion also takes out something that matters."},{"type":"team","members":[{"sprite":"mon:METAGROSS","sp":"METAGROSS","name":"Metagross","types":["STEEL","PSYCHIC"],"ability":"Clear Body","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Adamant","moves":[{"type":"STEEL","name":"Meteor Mash","power":100,"target":"","how":"Lv 50","tip":"","alt":""},{"type":"GROUND","name":"Earthquake","power":100,"target":"all · hits ally","how":"TM26","tip":"","alt":""},{"type":"NORMAL","name":"Explosion","power":250,"target":"all · hits ally","how":"Tutor (Pacifidlog Town)","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""},{"sprite":"mon:GENGAR","sp":"GENGAR","name":"Gengar","types":["GHOST","POISON"],"ability":"Levitate","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Timid","moves":[{"type":"ELECTRIC","name":"Thunderbolt","power":95,"target":"","how":"TM24","tip":"","alt":""},{"type":"ICE","name":"Ice Punch","power":75,"target":"","how":"Tutor (Battle Frontier)","tip":"","alt":""},{"type":"NORMAL","name":"Explosion","power":250,"target":"all · hits ally","how":"Tutor (Pacifidlog Town)","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Rain Thunder"},{"type":"p","html":"In rain, Thunder has 120 power and <b>never misses</b>, while Surf gets a 50% boost and hits both foes. Lanturn’s Water/Electric typing resists the Electric attacks aimed at Pelipper, so it’s a safe switch-in (Volt Absorb even heals it). Pelipper’s Flying type makes it immune to Ground attacks aimed at Lanturn."},{"type":"team","members":[{"sprite":"mon:PELIPPER","sp":"PELIPPER","name":"Pelipper","types":["WATER","FLYING"],"ability":"Keen Eye","item":{"icon":"item:ITEM_MYSTIC_WATER","key":"ITEM_MYSTIC_WATER","name":"Mystic Water"},"nature":"Modest","moves":[{"type":"WATER","name":"Rain Dance","power":"—","target":"","how":"Lv 35 · TM18","tip":"","alt":""},{"type":"WATER","name":"Surf","power":95,"target":"both foes · ½","how":"HM03","tip":"","alt":""},{"type":"ICE","name":"Ice Beam","power":95,"target":"","how":"TM13","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"Lv 1 · TM17","tip":"","alt":""}],"note":""},{"sprite":"mon:LANTURN","sp":"LANTURN","name":"Lanturn","types":["WATER","ELECTRIC"],"ability":"Volt Absorb","item":{"icon":"item:ITEM_MAGNET","key":"ITEM_MAGNET","name":"Magnet"},"nature":"Modest","moves":[{"type":"ELECTRIC","name":"Thunder","power":120,"target":"","how":"Lv 47 · TM25","tip":"","alt":""},{"type":"WATER","name":"Surf","power":95,"target":"both foes · ½","how":"HM03","tip":"","alt":""},{"type":"ICE","name":"Ice Beam","power":95,"target":"","how":"TM13","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Follow Me + Belly Drum"},{"type":"p","html":"<b>Belly Drum</b> costs half of Azumarill’s max HP and maxes its Attack (+6). Huge Power then doubles that. The drum turn is the risky one, so Togetic uses <b>Follow Me</b> that same turn to draw the foes’ single-target attacks. Spread moves like Rock Slide still hit both."},{"type":"team","members":[{"sprite":"mon:TOGETIC","sp":"TOGETIC","name":"Togetic","types":["NORMAL","FLYING"],"ability":"Serene Grace","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Bold","moves":[{"type":"NORMAL","name":"Follow Me","power":"—","target":"","how":"Lv 26","tip":"","alt":""},{"type":"NORMAL","name":"Helping Hand","power":"—","target":"","how":"Lv 1","tip":"","alt":""},{"type":"NORMAL","name":"Encore","power":"—","target":"","how":"Lv 21","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""},{"sprite":"mon:AZUMARILL","sp":"AZUMARILL","name":"Azumarill","types":["WATER"],"ability":"Huge Power","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Adamant","moves":[{"type":"NORMAL","name":"Belly Drum","power":"—","target":"","how":"Lv 45","tip":"","alt":""},{"type":"NORMAL","name":"Return","power":"varies","target":"","how":"TM27","tip":"","alt":""},{"type":"FIGHTING","name":"Brick Break","power":75,"target":"","how":"TM31","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Heal your partner with Volt Absorb"},{"type":"p","html":"In doubles you can aim a single-target move at <b>your own partner</b>. An Electric attack into a Volt Absorb ally does no damage and heals it <b>¼ of its max HP</b> (Water into Water Absorb works the same way). Both of these Pokémon have Volt Absorb, so each can heal the other with Thunderbolt, and neither fears the other side’s Electric attacks. It costs a turn, so do it while the partner Protects or the foes are slowed."},{"type":"team","members":[{"sprite":"mon:JOLTEON","sp":"JOLTEON","name":"Jolteon","types":["ELECTRIC"],"ability":"Volt Absorb","item":{"icon":"item:ITEM_MAGNET","key":"ITEM_MAGNET","name":"Magnet"},"nature":"Timid","moves":[{"type":"ELECTRIC","name":"Thunderbolt","power":95,"target":"","how":"TM24","tip":"","alt":""},{"type":"ELECTRIC","name":"Thunder Wave","power":"—","target":"","how":"Lv 42 · Tutor (Battle Frontier)","tip":"","alt":""},{"type":"NORMAL","name":"Helping Hand","power":"—","target":"","how":"Lv 1","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""},{"sprite":"mon:LANTURN","sp":"LANTURN","name":"Lanturn","types":["WATER","ELECTRIC"],"ability":"Volt Absorb","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Modest","moves":[{"type":"ELECTRIC","name":"Thunderbolt","power":95,"target":"","how":"Lv 33 · TM24","tip":"","alt":""},{"type":"WATER","name":"Surf","power":95,"target":"both foes · ½","how":"HM03","tip":"","alt":""},{"type":"ICE","name":"Ice Beam","power":95,"target":"","how":"TM13","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Flash Fire power-up"},{"type":"p","html":"On turn one, each <b>Flamethrowers its partner</b>. Flash Fire absorbs the hit (no damage) and powers up the holder’s own Fire moves <b>×1.5</b> until it switches out. After that, both fire boosted Heat Waves into the foes, and Heat Wave never hits your own side. Will-O-Wisp won’t work here: it fails against Fire types before Flash Fire can activate."},{"type":"team","members":[{"sprite":"mon:NINETALES","sp":"NINETALES","name":"Ninetales","types":["FIRE"],"ability":"Flash Fire","item":{"icon":"item:ITEM_CHARCOAL","key":"ITEM_CHARCOAL","name":"Charcoal"},"nature":"Timid","moves":[{"type":"FIRE","name":"Flamethrower","power":95,"target":"","how":"Lv 29 · TM35","tip":"","alt":""},{"type":"FIRE","name":"Heat Wave","power":100,"target":"both foes · ½","how":"Egg move · Move Relearner · or breed <a class=\"xl\" data-app=\"pokedex\" data-key=\"QUILAVA\">Quilava</a> ♂ → <a class=\"xl\" data-app=\"pokedex\" data-key=\"VULPIX\">Vulpix</a>","tip":"","alt":""},{"type":"FIRE","name":"Will-O-Wisp","power":"—","target":"","how":"Lv 17","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""},{"sprite":"mon:ARCANINE","sp":"ARCANINE","name":"Arcanine","types":["FIRE"],"ability":"Flash Fire","item":{"icon":"item:ITEM_CHARCOAL","key":"ITEM_CHARCOAL","name":"Charcoal"},"nature":"Modest","moves":[{"type":"FIRE","name":"Flamethrower","power":95,"target":"","how":"Lv 35 · TM35","tip":"","alt":""},{"type":"FIRE","name":"Heat Wave","power":100,"target":"both foes · ½","how":"Egg move · Move Relearner · or breed <a class=\"xl\" data-app=\"pokedex\" data-key=\"QUILAVA\">Quilava</a> ♂ → <a class=\"xl\" data-app=\"pokedex\" data-key=\"GROWLITHE\">Growlithe</a>","tip":"","alt":""},{"type":"NORMAL","name":"Extreme Speed","power":80,"target":"","how":"Lv 49","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Skill Swap away Truant"},{"type":"p","html":"Skill Swap trades abilities with the target, and in Gen 3 it only fails on Wonder Guard. Swap with Slaking: <b>Slaking loses Truant</b> and attacks every turn with base 160 Attack and Choice Band. Gardevoir now has Truant, so on its next active turn it can Skill Swap again with a dangerous foe, handing Truant to that foe."},{"type":"team","members":[{"sprite":"mon:GARDEVOIR","sp":"GARDEVOIR","name":"Gardevoir","types":["PSYCHIC"],"ability":"Trace","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Modest","moves":[{"type":"PSYCHIC","name":"Skill Swap","power":"—","target":"","how":"TM48","tip":"","alt":""},{"type":"PSYCHIC","name":"Psychic","power":90,"target":"","how":"Lv 36 · TM29","tip":"","alt":""},{"type":"PSYCHIC","name":"Calm Mind","power":"—","target":"","how":"Lv 26 · TM04","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""},{"sprite":"mon:SLAKING","sp":"SLAKING","name":"Slaking","types":["NORMAL"],"ability":"Truant","item":{"icon":"item:ITEM_CHOICE_BAND","key":"ITEM_CHOICE_BAND","name":"Choice Band"},"nature":"Adamant","moves":[{"type":"NORMAL","name":"Return","power":"varies","target":"","how":"TM27","tip":"","alt":""},{"type":"DARK","name":"Faint Attack","power":70,"target":"","how":"Lv 19","tip":"","alt":""},{"type":"ROCK","name":"Rock Slide","power":80,"target":"both foes · ½","how":"Tutor (Battle Frontier)","tip":"","alt":""},{"type":"FIGHTING","name":"Brick Break","power":75,"target":"","how":"TM31","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Soundproof + Perish Song"},{"type":"p","html":"Perish Song starts a 3-turn countdown on every Pokémon on the field, <b>except those with Soundproof</b>. Exploud ignores it and keeps attacking with Hyper Voice (hits both foes), so only Lapras has to switch out before the count ends."},{"type":"team","members":[{"sprite":"mon:EXPLOUD","sp":"EXPLOUD","name":"Exploud","types":["NORMAL"],"ability":"Soundproof","item":{"icon":"item:ITEM_SILK_SCARF","key":"ITEM_SILK_SCARF","name":"Silk Scarf"},"nature":"Hasty","moves":[{"type":"NORMAL","name":"Hyper Voice","power":100,"target":"both foes · ½","how":"Lv 40","tip":"","alt":""},{"type":"ICE","name":"Ice Beam","power":95,"target":"","how":"TM13","tip":"","alt":""},{"type":"FIRE","name":"Flamethrower","power":95,"target":"","how":"TM35","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""},{"sprite":"mon:LAPRAS","sp":"LAPRAS","name":"Lapras","types":["WATER","ICE"],"ability":"Water Absorb","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Calm","moves":[{"type":"NORMAL","name":"Perish Song","power":"—","target":"","how":"Lv 25","tip":"","alt":""},{"type":"WATER","name":"Surf","power":95,"target":"both foes · ½","how":"HM03","tip":"","alt":""},{"type":"ICE","name":"Ice Beam","power":95,"target":"","how":"Lv 31 · TM13","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Imprison + Protect"},{"type":"p","html":"<b>Imprison</b> stops both foes from using any move the user also knows. Because Banette knows <b>Protect</b>, the foes can’t Protect, so Golem’s Earthquake and Explosion land. Banette is a Ghost, so Explosion can’t hurt it. In Gen 3 Imprison fails if no foe shares a move with the user, but almost everything carries Protect."},{"type":"team","members":[{"sprite":"mon:BANETTE","sp":"BANETTE","name":"Banette","types":["GHOST"],"ability":"Insomnia","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Modest","moves":[{"type":"PSYCHIC","name":"Imprison","power":"—","target":"","how":"Egg move · Move Relearner · or breed <a class=\"xl\" data-app=\"pokedex\" data-key=\"GARDEVOIR\">Gardevoir</a> ♂ → <a class=\"xl\" data-app=\"pokedex\" data-key=\"SHUPPET\">Shuppet</a>","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""},{"type":"FIRE","name":"Will-O-Wisp","power":"—","target":"","how":"Lv 29","tip":"","alt":""},{"type":"GHOST","name":"Shadow Ball","power":80,"target":"","how":"Lv 32 · TM30","tip":"","alt":""}],"note":""},{"sprite":"mon:GOLEM","sp":"GOLEM","name":"Golem","types":["ROCK","GROUND"],"ability":"Sturdy","item":{"icon":"item:ITEM_SOFT_SAND","key":"ITEM_SOFT_SAND","name":"Soft Sand"},"nature":"Adamant","moves":[{"type":"NORMAL","name":"Explosion","power":250,"target":"all · hits ally","how":"Lv 46 · Tutor (Pacifidlog Town)","tip":"","alt":""},{"type":"GROUND","name":"Earthquake","power":100,"target":"all · hits ally","how":"Lv 42 · TM26","tip":"","alt":""},{"type":"ROCK","name":"Rock Slide","power":80,"target":"both foes · ½","how":"Tutor (Battle Frontier)","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Swagger + Own Tempo"},{"type":"p","html":"Swagger raises the target’s Attack by 2 and then tries to confuse it. <b>Own Tempo</b> blocks the confusion but not the boost, so fast Crobat can Swagger Lickitung for a free +2. Crobat is Flying, so Lickitung’s boosted Earthquake never hits it. The same trick works once on any partner holding a <b>Lum Berry</b>, which cures confusion."},{"type":"team","members":[{"sprite":"mon:CROBAT","sp":"CROBAT","name":"Crobat","types":["POISON","FLYING"],"ability":"Inner Focus","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Jolly","moves":[{"type":"NORMAL","name":"Swagger","power":"—","target":"","how":"Tutor (Slateport City)","tip":"","alt":""},{"type":"FLYING","name":"Aerial Ace","power":60,"target":"","how":"TM40","tip":"","alt":""},{"type":"DARK","name":"Taunt","power":"—","target":"","how":"TM12","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""},{"sprite":"mon:LICKITUNG","sp":"LICKITUNG","name":"Lickitung","types":["NORMAL"],"ability":"Own Tempo","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Adamant","moves":[{"type":"NORMAL","name":"Return","power":"varies","target":"","how":"TM27","tip":"","alt":""},{"type":"GROUND","name":"Earthquake","power":100,"target":"all · hits ally","how":"TM26","tip":"","alt":""},{"type":"DARK","name":"Knock Off","power":50,"target":"","how":"Lv 22","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Memento into a sweeper"},{"type":"p","html":"<b>Memento</b> makes Weezing faint and sharply lowers one foe’s Attack <i>and</i> Sp. Atk (−2 each). Use it on the foe most able to hurt Gyarados, while Gyarados uses Dragon Dance. Before that, Weezing’s Levitate lets Gyarados use Earthquake freely."},{"type":"team","members":[{"sprite":"mon:WEEZING","sp":"WEEZING","name":"Weezing","types":["POISON"],"ability":"Levitate","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Impish","moves":[{"type":"DARK","name":"Memento","power":"—","target":"","how":"Lv 30","tip":"","alt":""},{"type":"FIRE","name":"Will-O-Wisp","power":"—","target":"","how":"Egg move · Move Relearner · or breed <a class=\"xl\" data-app=\"pokedex\" data-key=\"DUSCLOPS\">Dusclops</a> ♂ → <a class=\"xl\" data-app=\"pokedex\" data-key=\"KOFFING\">Koffing</a>","tip":"","alt":""},{"type":"POISON","name":"Sludge Bomb","power":95,"target":"","how":"Lv 36 · TM36","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""},{"sprite":"mon:GYARADOS","sp":"GYARADOS","name":"Gyarados","types":["WATER","FLYING"],"ability":"Intimidate","item":{"icon":"item:ITEM_LEFTOVERS","key":"ITEM_LEFTOVERS","name":"Leftovers"},"nature":"Adamant","moves":[{"type":"DRAGON","name":"Dragon Dance","power":"—","target":"","how":"Lv 57","tip":"","alt":""},{"type":"GROUND","name":"Earthquake","power":100,"target":"all · hits ally","how":"TM26","tip":"","alt":""},{"type":"NORMAL","name":"Double Edge","power":120,"target":"","how":"Tutor (Sootopolis City)","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}]},{"type":"h","text":"Magnet Pull trap"},{"type":"p","html":"<b>Magnet Pull</b> stops Steel types from switching out, so Skarmory, Metagross, Aggron and Forretress are stuck in front of Arcanine’s Fire attacks. <b>Careful:</b> in Gen 3 it checks the whole field, so Magneton also traps <b>your own</b> Steel types. Arcanine isn’t one."},{"type":"team","members":[{"sprite":"mon:MAGNETON","sp":"MAGNETON","name":"Magneton","types":["ELECTRIC","STEEL"],"ability":"Magnet Pull","item":{"icon":"item:ITEM_MAGNET","key":"ITEM_MAGNET","name":"Magnet"},"nature":"Modest","moves":[{"type":"ELECTRIC","name":"Thunderbolt","power":95,"target":"","how":"Lv 36 · TM24","tip":"","alt":""},{"type":"ELECTRIC","name":"Thunder Wave","power":"—","target":"","how":"Lv 22 · Tutor (Battle Frontier)","tip":"","alt":""},{"type":"NORMAL","name":"Substitute","power":"—","target":"","how":"Tutor (Lilycove City)","tip":"","alt":""},{"type":"NORMAL","name":"Protect","power":"—","target":"","how":"TM17","tip":"","alt":""}],"note":""}, const isMobile = () => window.innerWidth <= 700;
let currentPage = null;

function img(ref, alt) {
  const s = ref && SPRITES[ref];
  return s ? `<img src="${s}" alt="${alt || ''}">` : '';
}

function goBack() {
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('main').classList.add('hidden');
}

function renderList() {
  const list = document.getElementById('page-list');
  let lastSec = null, html = '';
  PAGES.forEach(p => {
    if (p.section !== lastSec) { lastSec = p.section; html += `<div class="cat-header">${p.section}</div>`; }
    html += `<div class="pg-item${p.id === currentPage ? ' active' : ''}" onclick="selectPage('${p.id}')">
      <div class="pg-name">${p.title}</div><div class="pg-kicker">${p.kicker}</div></div>`;
  });
  list.innerHTML = html;
}

function xlink(app, key, label) {
  return key ? `<a class="xl" data-app="${app}" data-key="${key}">${label}</a>` : label;
}
function monKey(sprite) { return sprite && /^(mon|shiny):/.test(sprite) && !/:EGG$/.test(sprite) ? sprite.split(':')[1] : null; }
function chip(it) {
  return `<span class="chip">${img(it.icon, it.name)}${xlink('bag', it.icon && it.icon.slice(5), it.name)}${it.n > 1 ? ' ×' + it.n : ''}</span>`;
}

let finderSort = 'importance';
let finderBR = true;
const FINDER_SORTS = {
  importance: (a, b) => a.imp - b.imp || a.name.localeCompare(b.name),
  chrono:     (a, b) => a.first - b.first || a.imp - b.imp,
  common:     (a, b) => b.count - a.count || a.imp - b.imp,
};
function setFinderBR(on) { finderBR = on; setFinderSort(finderSort); }
function setFinderSort(mode) {
  finderSort = mode;
  const p = PAGES.find(x => x.id === currentPage);
  const b = p.blocks.find(x => x.type === 'itemfinder');
  document.getElementById('itemfinder').outerHTML = renderFinder(b);
}
function renderFinder(b) {
  const items = b.items.map(it => {
    const holders = it.holders.filter(h => finderBR || !h.br);
    return {...it, holders, count: holders.reduce((s, h) => s + h.n, 0), first: Math.min(...holders.map(h => h.chrono))};
  }).filter(it => it.holders.length).sort(FINDER_SORTS[finderSort]);
  const holderSort = finderSort === 'chrono'
    ? (x, y) => x.chrono - y.chrono
    : (x, y) => (y.repeat - x.repeat) || x.chrono - y.chrono;
  const btn = (m, label) => `<button class="sort-btn${finderSort === m ? ' active' : ''}" onclick="setFinderSort('${m}')">${label}</button>`;
  return `<div id="itemfinder">
    <div class="sortbar"><span class="lbl">Order by</span>${btn('importance', 'Importance')}${btn('chrono', 'Chronological')}${btn('common', 'Most common')}
      <button class="sort-btn${finderBR ? ' active' : ''}" style="margin-left:auto" onclick="setFinderBR(${!finderBR})">${finderBR ? '☑' : '☐'} Battle Royale trainers</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Tier</th><th>Copies</th><th>Steal from</th></tr></thead><tbody>
    ${items.map(it => `<tr>
      <td><span class="it-name">${img(it.icon, it.name)}${xlink('bag', it.key, it.name)}</span></td>
      <td><span class="tier tier-${it.tier}">${it.tier}</span></td>
      <td>${it.count}</td>
      <td>${[...it.holders].sort(holderSort).map(h =>
        `${h.repeat ? '↻ ' : ''}${xlink('trainers', h.tv, h.label)}${h.n > 1 ? ' ×' + h.n : ''}${h.post ? '<span class="pg">Post</span>' : ''}${h.br ? '<span class="pg br">BR</span>' : ''} <span class="dim">· ${h.locs}</span>`).join('<br>')}</td>
    </tr>`).join('')}
    </tbody></table></div></div>`;
}

function cell(c) {
  if ('sprite' in c) {
    const link = c.link || (monKey(c.sprite) ? ['pokedex', monKey(c.sprite)] : null);
    return `<span class="ent">${img(c.sprite, c.text)}${link ? xlink(link[0], link[1], c.text) : c.text}</span>`;
  }
  if (c.items) return c.items.map(chip).join('');
  if (c.mons) return `<div class="mons">${c.mons.map(m => `<span class="mon" title="${m.nature}${m.moves.length ? ' · ' + m.moves.join(', ') : ''}">${img(m.sprite, m.name)}<span>${xlink('pokedex', m.sp, m.name)}${m.item ? `<br><span class="dim">${img(m.icon, m.item)}${xlink('bag', m.icon && m.icon.slice(5), m.item)}</span>` : ''}</span></span>`).join('')}</div>`;
  return c.html !== undefined ? c.html : c.text;
}

function tyIcon(t) { return `<img class="tyicon" src="${SPRITES['type:' + t] || ''}" alt="${t}" title="${t[0] + t.slice(1).toLowerCase()}">`; }
function monChip(m) { return `<span class="monchip" data-tip="${m.name}">${img(m.sprite, m.name)}${xlink('pokedex', m.sp, m.name)}</span>`; }
function renderMember(x) {
  return `<div class="tm">
    <div class="duo-mon">${img(x.sprite, x.name)}<div><div class="card-title">${xlink('pokedex', x.sp, x.name)}</div>
      <div class="duo-types">${x.types.map(tyIcon).join('')}</div>
      <div class="tm-meta"><span>${x.ability}</span><span class="it-name">${img(x.item.icon, x.item.name)}${xlink('bag', x.item.key, x.item.name)}</span><span>${x.nature}</span>${x.stat ? `<span class="stat-tag">${x.stat}</span>` : ''}</div></div></div>
    <div class="duo-moves">${x.moves.map(m => `<div class="duo-move">
      ${tyIcon(m.type)}<span class="mv-name${m.tip ? ' has-alt' : ''}" data-move="${m.name}"${m.tip ? ` data-tip="${m.tip.replace(/"/g, '&quot;')}"` : ''}>${m.name}${m.tip ? `<span class="alt-flag">⚑ ${m.alt}</span>` : ''}${m.target ? `<span class="tgt">${m.target}</span>` : ''}</span>
      <span class="mv-pow">${m.power}</span>
      <span class="mv-how">${m.how}</span></div>`).join('')}</div>
    ${x.note ? `<div class="note">${x.note}</div>` : ''}
  </div>`;
}
function renderMatchups(mu) {
  const lab = x => x === 0 ? '0' : x >= 4 ? '4×' : x >= 2 ? '2×' : x <= 0.25 ? '¼' : x <= 0.5 ? '½' : '';
  const cls = x => x === 0 ? 'imm' : x > 1 ? 'weak' : x < 1 ? 'res' : '';
  const word = x => x === 0 ? 'immune' : x > 1 ? `weak (${lab(x)})` : x < 1 ? `resists (${lab(x)})` : 'neutral';
  return `<div class="mu-wrap"><table class="mu"><thead><tr><th></th>${mu.types.map(t => `<th>${tyIcon(t)}</th>`).join('')}</tr></thead><tbody>
    ${mu.rows.map((row, i) => `<tr><th class="mu-name">${mu.names[i]}</th>${row.map((x, j) =>
      `<td class="${cls(x)}" data-tip="<b>${mu.names[i]}</b> vs ${mu.types[j][0] + mu.types[j].slice(1).toLowerCase()}: ${word(x)}">${lab(x)}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>`;
}
function renderDuo(d) {
  const side = s => `<div class="duo-side">
    <div class="duo-mon">${img(s.mon.sprite, s.mon.name)}<div><div class="card-title">${xlink('pokedex', s.mon.sp, s.mon.name)}</div>
      <div class="duo-types">${s.types.map(tyIcon).join('')}</div><div class="dim">${s.ability}</div></div></div>
    <div class="duo-moves">${s.moves.map(m => `<div class="duo-move">
      ${tyIcon(m.type)}<span class="mv-name" data-move="${m.name}">${m.name}</span>
      <span class="mv-pow">${m.power}${m.stab ? '<span class="stab">STAB</span>' : ''}</span>
      <span class="mv-how">${m.how}</span></div>`).join('')}</div></div>`;
  const pct = 100 * d.hit / d.total;
  return `<div class="duo">
    <div class="duo-grid">${side(d.a)}${side(d.b)}</div>
    ${d.matchups ? renderMatchups(d.matchups) : ''}
    <div class="duo-meter" data-tip="${d.hit} of ${d.total} hittable species">
      <span class="lbl">Coverage</span><span class="bar-track"><span class="bar-fill" style="width:${pct.toFixed(2)}%"></span></span>
      <span class="bar-n">${d.hit}/${d.total}</span></div>
    <div class="duo-miss"><span class="lbl">Misses</span>${d.missed.slice(0, 14).map(monChip).join('')}${d.missed.length > 14 ? `<span class="dim" data-tip="${d.missed.slice(14).map(m => m.name).join(', ')}">+${d.missed.length - 14} more</span>` : ''}</div>
    <div class="duo-doubles ${d.doubles.ok ? 'ok' : 'warn'}"><span class="glyph">${d.doubles.ok ? '✓' : '⚠'}</span><span>${d.doubles.html}</span></div>
  </div>`;
}
const tip = document.createElement('div');
tip.id = 'tip';
document.body.appendChild(tip);
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.dataset.tip;
  tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - r.width - 8) + 'px';
  tip.style.top = (e.clientY + 18 + r.height > window.innerHeight ? e.clientY - r.height - 10 : e.clientY + 18) + 'px';
});

function renderBlock(b) {
  switch (b.type) {
    case 'p': return `<p class="p">${b.html}</p>`;
    case 'h': return `<div class="section-title">${b.text}</div>`;
    case 'callout': return `<div class="callout">${b.html}</div>`;
    case 'list': return `<ul class="list">${b.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
    case 'table':
      return `<div class="tbl-wrap"><table><thead><tr>${b.head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'itemfinder': return renderFinder(b);
    case 'stats':
      return `<div class="stats">${b.items.map(it => `<div class="stat">
        <div class="stat-v">${it.value}</div><div class="stat-l">${it.label}</div>
        ${it.mons ? `<div class="stat-mons">${it.mons.map(monChip).join('')}</div>` : ''}</div>`).join('')}</div>`;
    case 'bars': {
      const max = Math.max(...b.rows.map(r => r.n));
      return `<div class="bars" role="table" aria-label="Species hit super effectively per attacking type">${b.rows.map(r => {
        const pct = (100 * r.n / b.total).toFixed(1);
        return `<div class="bar-row" role="row" data-tip="<b>${r.label}</b> hits ${r.n} of ${b.total} species super effectively (${pct}%)">
          <span class="bar-type" role="rowheader">${tyIcon(r.type)}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${(100 * r.n / max).toFixed(2)}%"></span></span>
          <span class="bar-n" role="cell">${r.n}</span></div>`;
      }).join('')}</div>`;
    }
    case 'bottlenecks':
      return `<div class="bneck">${b.items.map(g => `<div class="bneck-row">
        <div class="bneck-type">${g.types.map(tyIcon).join('<span>or</span>')}</div>
        <div class="bneck-mons">${g.mons.map(monChip).join('')}</div></div>`).join('')}</div>`;
    case 'typesets':
      return `<div class="typesets">${b.sets.map(set => `<div class="typeset">${set.map(tyIcon).join('')}</div>`).join('')}
        ${b.note ? `<div class="typeset-note">${b.note} ${b.mons.map(monChip).join('')}</div>` : ''}</div>`;
    case 'monlist': return `<div class="bneck-mons monlist">${b.mons.map(monChip).join('')}</div>`;
    case 'leads':
      return `<div class="leads"><span class="lbl">Suggested leads</span>${b.leads.map(pair => `<span class="lead">${pair.map(monChip).join('<span class="plus">+</span>')}</span>`).join('')}</div>`;
    case 'team':
      return `<div class="team">${b.members.map(renderMember).join('')}</div>`;
    case 'duos':
      return `<div class="duos">${b.items.map(renderDuo).join('')}</div>`;
    case 'cards':
      return `<div class="cards">${b.items.map(it => `<div class="card">
        <div class="card-head">
          <div class="card-sprites">${img(it.sprite, it.title)}${(it.extra || []).map(e => img(e)).join('')}</div>
          <div><div class="card-title">${(it.extra || []).length || !monKey(it.sprite) ? it.title : xlink('pokedex', monKey(it.sprite), it.title)}</div>${it.sub ? `<div class="card-sub">${it.sub}</div>` : ''}</div>
        </div>
        ${it.place ? `<div class="card-place">${it.place}</div>` : ''}
        ${it.want ? `<div class="card-want">Trade your ${img(it.wantSprite, it.want)}<span>${xlink('pokedex', monKey(it.wantSprite), it.want)}</span></div>` : ''}
        ${it.rows ? `<div class="card-rows">${it.rows.map(([k, v]) => `<span class="k">${k}</span><span>${v}</span>`).join('')}</div>` : ''}
        ${it.note ? `<div class="note">${it.note}</div>` : ''}
      </div>`).join('')}</div>`;
  }
  return '';
}

function selectPage(id) {
  const p = PAGES.find(x => x.id === id);
  if (!p) return;
  currentPage = id;
  renderList();
  document.getElementById('page').innerHTML =
    (`<div class="kicker">${p.section} · ${p.kicker}</div><h2>${p.title}</h2>` + p.blocks.map(renderBlock).join(''))
      .replace(/src="TYPEICON:(\w+)"/g, (_, t) => `src="${SPRITES['type:' + t]}"`);
  if (isMobile()) {
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
  }
  document.getElementById('main').scrollTop = 0;
  window.scrollTo(0, 0);
}

renderList();
registerApp('guide', key => selectPage(key));
if (!currentPage && !isMobile()) selectPage(PAGES[0].id);
</script>
</body>
</html>
